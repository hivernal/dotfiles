Section "OutputClass"
  Identifier "AMD GPU"
  MatchDriver "amdgpu"
  Driver "amdgpu"
  Option "DRI" "3"
  Option "TearFree" "on"
  Option "EnablePageFlip" "on"
  Option "VariableRefresh" "on"
EndSection

Section "Monitor"
  Identifier "DisplayPort-2"
  Modeline "3840x2160@135" 1222.664 3840 3848 3880 3920 2160 2300 2308 2314 +hsync -vsync
  Option "PreferredMode" "3840x2160@135"
  Option "Position" "0 0"
EndSection

Section "Monitor"
  Identifier "DisplayPort-1"
  Modeline "1920x1080@135" 312.768 1920 1928 1960 2000 1080 1143 1151 1157 +hsync -vsync
  Option "PreferredMode" "1920x1080@135"
  Option "Position" "0 2160"
EndSection

Section "Screen"
  Identifier "Screen1"
  Device "AMD GPU"
  Monitor "DisplayPort-2"
  SubSection "Display"
  EndSubSection
EndSection

Section "Screen"
  Identifier "Screen2"
  Device "AMD GPU"
  Monitor "DisplayPort-1"
  SubSection "Display"
  EndSubSection
EndSection
