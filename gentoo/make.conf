# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-march=native -O2 -pipe -flto"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="${RUSTFLAGS} -C target-cpu=native"
MAKEOPTS="-j12 -l12"

USE="X screencast bluetooth gstreamer elogind wayland hwaccel dbus stack-realign lm-sensors pgo lto policykit pipewire pulseaudio opengl vulkan vaapi"

VIDEO_CARDS="amdgpu radeonsi"
QEMU_SOFTMMU_TARGETS="x86_64"
QEMU_USER_TARGETS="x86_64"


GRUB_PLATFORMS="efi-64"
L10N="en en-US en_US ru ru-RU ru_RU"
ACCEPT_LICENSE="@BINARY-REDISTRIBUTABLE ValveSteamLicense"

# NOTE: This stage was built with the bindist USE flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.utf8

GENTOO_MIRRORS="http://mirror.mephi.ru/gentoo-distfiles/ \
    https://gentoo-mirror.alexxy.name/ \
    https://ru.mirrors.cicku.me/gentoo/ \
    https://mirror.yandex.ru/gentoo-distfiles/"
